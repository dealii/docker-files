name: dependencies

on:
  workflow_dispatch:
  pull_request:
    paths:
    - .github/workflows/dependencies.yml
    - dependencies/**
    - dealii/**

permissions:
  contents: read
  packages: write

jobs:
  build-dependencies:
    if: (github.repository == 'dealii/docker-files')
    name: dependencies - ${{ matrix.system.ubuntu_version }} - ${{ matrix.arch.tag }}
    runs-on: ${{ matrix.arch.runner }}

    strategy:
      fail-fast: false
      matrix:
        arch:
          - build: linux/arm64
            runner: ubuntu-24.04-arm
            tag: arm64
            flags: -mno-outline-atomics
          - build: linux/amd64
            runner: ubuntu-24.04
            tag: amd64
            flags: ""

        system:
          - ubuntu_version: jammy
            dealii_version: 9.7.1-1~ubuntu22.04.1~ppa1
            repository: ppa:ginggs/deal.ii-9.7.1-backports
            tag: jammy-v9.7.1
          - ubuntu_version: noble
            dealii_version: 9.8.0-1~ubuntu24.04.1~ppa2
            repository: ppa:ginggs/deal.ii-9.8.0-backports
            tag: noble-v9.8.0
          - ubuntu_version: resolute
            dealii_version: 9.8.0-1~ubuntu26.04.1~ppa2
            repository: ppa:ginggs/deal.ii-9.8.0-backports
            tag: resolute-v9.8.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Free space for the compatibility build
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Build dependency candidate
        uses: docker/build-push-action@v7
        with:
          context: ./dependencies/
          cache-from: type=registry,ref=dealii/dependencies:${{ matrix.system.ubuntu_version }}-${{ matrix.arch.tag }}
          build-args: |
            IMG=${{ matrix.system.ubuntu_version }}
            VERSION=${{ matrix.system.dealii_version }}
            REPO=${{ matrix.system.repository }}
          platforms: ${{ matrix.arch.build }}
          load: true
          tags: dealii/dependencies:candidate

      - name: Build and test deal.II against the candidate
        uses: docker/build-push-action@v7
        with:
          context: ./dealii/
          build-args: |
            IMG=${{ matrix.system.ubuntu_version }}
            DEPENDENCIES_IMAGE=dealii/dependencies:candidate
            VER=master
            NJOBS=4
            FLAGS=${{ matrix.arch.flags }}
          platforms: ${{ matrix.arch.build }}
          outputs: type=cacheonly

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish tested dependencies
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ./dependencies/
          cache-to: type=inline
          build-args: |
            IMG=${{ matrix.system.ubuntu_version }}
            VERSION=${{ matrix.system.dealii_version }}
            REPO=${{ matrix.system.repository }}
          platforms: ${{ matrix.arch.build }}
          push: true
          tags: dealii/dependencies:${{ matrix.system.tag }}-${{ matrix.arch.tag }}

  merge-dependencies:
    if: |
      github.repository == 'dealii/docker-files' &&
      github.event_name != 'pull_request'
    name: dependencies - dealii/dependencies - ${{ matrix.os }}
    runs-on: ubuntu-latest
    needs: build-dependencies

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: jammy
            ver: v9.7.1
          - os: noble
            ver: v9.8.0
          - os: resolute
            ver: v9.8.0

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Merge images of dealii/dependencies:${{ matrix.os }}
        run: |
          docker buildx imagetools create \
             -t dealii/dependencies:${{ matrix.os }} \
             -t dealii/dependencies:${{ matrix.os }}-${{ matrix.ver }} \
             dealii/dependencies:${{ matrix.os }}-${{ matrix.ver }}-amd64 \
             dealii/dependencies:${{ matrix.os }}-${{ matrix.ver }}-arm64
